id: a1b2c3d4-0004-4444-8888-000000000004
name: Known Credential Dumping Tool Signatures
description: |
  Detects command-line indicators and file names associated with known
  credential dumping tools such as Mimikatz and its variants.
severity: High
requiredDataConnectors:
  - connectorId: MicrosoftThreatProtection
    dataTypes:
      - DeviceProcessEvents
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics:
  - CredentialAccess
relevantTechniques:
  - T1003
query: |
  DeviceProcessEvents
  | where ProcessCommandLine has_any ("sekurlsa", "logonpasswords", "lsadump", "kerberos::golden", "kerberos::ptt", "privilege::debug", "mimikatz", "invoke-mimikatz")
      or FileName in~ ("mimikatz.exe", "mimidrv.sys", "pypykatz.exe")
  | project TimeGenerated, DeviceName, AccountName, FileName, ProcessCommandLine, InitiatingProcessFileName, InitiatingProcessAccountName, SHA256
  | order by TimeGenerated desc

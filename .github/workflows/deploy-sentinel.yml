name: Deploy Microsoft Sentinel content

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "infra/**"
      - "hunts/**"

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sign in to Azure using GitHub OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Validate Bicep
        run: |
          az deployment group validate \
            --resource-group "${{ vars.SENTINEL_RESOURCE_GROUP }}" \
            --template-file infra/main.bicep \
            --parameters workspaceName="${{ vars.SENTINEL_WORKSPACE_NAME }}"

      - name: Deploy Sentinel content
        run: |
          az deployment group create \
            --name "sentinel-${{ github.run_number }}" \
            --resource-group "${{ vars.SENTINEL_RESOURCE_GROUP }}" \
            --template-file infra/main.bicep \
            --parameters workspaceName="${{ vars.SENTINEL_WORKSPACE_NAME }}"

name: Deploy Microsoft Sentinel content

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "hunts/**/*.bicep"
      - ".github/workflows/deploy-sentinel.yml"

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Sign in to Azure using GitHub OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Validate hunting-query Bicep templates
        shell: bash
        run: |
          set -euo pipefail

          for template in hunts/*.bicep; do
            echo "Validating $template"

            az deployment group validate \
              --resource-group "${{ vars.SENTINEL_RESOURCE_GROUP }}" \
              --template-file "$template" \
              --parameters workspace="${{ vars.SENTINEL_WORKSPACE_NAME }}"
          done

      - name: Deploy hunting queries
        shell: bash
        run: |
          set -euo pipefail

          for template in hunts/*.bicep; do
            template_name="$(basename "$template" .bicep)"

            echo "Deploying $template_name"

            az deployment group create \
              --name "hunt-${template_name}-${{ github.run_number }}" \
              --resource-group "${{ vars.SENTINEL_RESOURCE_GROUP }}" \
              --template-file "$template" \
              --parameters workspace="${{ vars.SENTINEL_WORKSPACE_NAME }}"
          done

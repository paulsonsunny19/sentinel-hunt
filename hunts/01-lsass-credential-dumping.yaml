id: a1b2c3d4-0001-4444-8888-000000000001
name: LSASS Memory Access (Credential Dumping)
description: |
  Detects processes accessing LSASS memory in patterns consistent with
  credential dumping tools (procdump, comsvcs.dll MiniDump technique).
severity: Medium
requiredDataConnectors:
  - connectorId: MicrosoftThreatProtection
    dataTypes:
      - DeviceProcessEvents
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics:
  - CredentialAccess
relevantTechniques:
  - T1003.001
query: |
  DeviceProcessEvents
  | where FileName in~ ("procdump.exe", "procdump64.exe", "rundll32.exe", "taskmgr.exe", "werfault.exe")
  | where ProcessCommandLine has_any ("lsass", "comsvcs.dll", "MiniDump")
  | project TimeGenerated, DeviceName, AccountName, FileName, ProcessCommandLine, InitiatingProcessFileName, InitiatingProcessAccountName
  | order by TimeGenerated desc

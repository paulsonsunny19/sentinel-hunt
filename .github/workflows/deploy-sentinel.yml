name: Deploy Microsoft Sentinel content

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "hunts/**/*.bicep"
      - ".github/workflows/deploy-sentinel.yml"

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Sign in to Azure using GitHub OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Show deployment target
        run: |
          az account show \
            --query "{tenant:tenantId, subscription:id, name:name}" \
            --output table

          echo "Resource group: ${{ vars.SENTINEL_RESOURCE_GROUP }}"
          echo "Workspace: ${{ vars.SENTINEL_WORKSPACE_NAME }}"

      - name: Validate hunting queries
        shell: bash
        run: |
          set -euo pipefail

          for template in hunts/0[1-4]-*.bicep; do
            echo "Validating $template"

            az deployment group validate \
              --resource-group "${{ vars.SENTINEL_RESOURCE_GROUP }}" \
              --template-file "$template" \
              --parameters workspace="${{ vars.SENTINEL_WORKSPACE_NAME }}"
          done

      - name: Deploy hunting queries
        shell: bash
        run: |
          set -euo pipefail

          for template in hunts/0[1-4]-*.bicep; do
            template_name="$(basename "$template" .bicep)"

            echo "Deploying $template_name"

            az deployment group create \
              --name "hunt-${template_name}-${{ github.run_number }}" \
              --resource-group "${{ vars.SENTINEL_RESOURCE_GROUP }}" \
              --template-file "$template" \
              --parameters workspace="${{ vars.SENTINEL_WORKSPACE_NAME }}"
          done

      - name: Validate hypothesis
        run: |
          az deployment group validate \
            --resource-group "${{ vars.SENTINEL_RESOURCE_GROUP }}" \
            --template-file hunts/99-credential-access-hypothesis.bicep \
            --parameters workspace="${{ vars.SENTINEL_WORKSPACE_NAME }}"

      - name: Create or update hypothesis
        run: |
          az deployment group create \
            --name "credential-hypothesis-${{ github.run_number }}" \
            --resource-group "${{ vars.SENTINEL_RESOURCE_GROUP }}" \
            --template-file hunts/99-credential-access-hypothesis.bicep \
            --parameters workspace="${{ vars.SENTINEL_WORKSPACE_NAME }}"

      - name: Verify hypothesis
        shell: bash
        run: |
          set -euo pipefail

          SUBSCRIPTION_ID="$(az account show --query id -o tsv)"
          HUNT_ID="c8b5de8d-a99f-4f47-bdd9-38ee5b8f8c01"

          HUNT_URL="https://management.azure.com/subscriptions/${SUBSCRIPTION_ID}/resourceGroups/${{ vars.SENTINEL_RESOURCE_GROUP }}/providers/Microsoft.OperationalInsights/workspaces/${{ vars.SENTINEL_WORKSPACE_NAME }}/providers/Microsoft.SecurityInsights/hunts/${HUNT_ID}?api-version=2025-10-01-preview"

          az rest \
            --method get \
            --url "$HUNT_URL" \
            --query "{name:properties.displayName,status:properties.status,hypothesis:properties.hypothesisStatus}" \
            --output table

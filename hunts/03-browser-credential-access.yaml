id: a1b2c3d4-0003-4444-8888-000000000003
name: Browser Credential Store Access
description: |
  Detects non-browser processes creating, modifying, or renaming browser
  credential store files (Chrome, Edge, Firefox), consistent with credential
  theft from local browser password stores.
severity: Medium
requiredDataConnectors:
  - connectorId: MicrosoftThreatProtection
    dataTypes:
      - DeviceFileEvents
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics:
  - CredentialAccess
relevantTechniques:
  - T1555.003
query: |
  DeviceFileEvents
  | where FolderPath has_any ("AppData\\Local\\Google\\Chrome\\User Data", "AppData\\Local\\Microsoft\\Edge\\User Data", "AppData\\Roaming\\Mozilla\\Firefox\\Profiles")
  | where FileName in~ ("Login Data", "Login Data For Account", "key4.db", "logins.json", "cookies.sqlite")
  | where ActionType in ("FileCreated", "FileModified", "FileRenamed")
  | where InitiatingProcessFileName !in~ ("chrome.exe", "msedge.exe", "firefox.exe")
  | project TimeGenerated, DeviceName, AccountName = InitiatingProcessAccountName, FileName, FolderPath, InitiatingProcessFileName, InitiatingProcessCommandLine
  | order by TimeGenerated desc
